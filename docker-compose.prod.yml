# The hosted layout, runnable on a laptop or a small server:
#   python scripts/init_production_env.py
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
#
# Only ONE service publishes ports: caddy (the door). The database, tool server, API and web app have no
# published port, so nothing outside the Docker network can reach them except through Caddy's allow-list.

name: stylist-prod   # a separate project, so it never mixes with the dev compose file's containers

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: stylist
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run scripts/init_production_env.py}
      POSTGRES_DB: stylist
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stylist"]
      interval: 5s
      timeout: 3s
      retries: 10
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID, FOWNER, DAC_OVERRIDE]   # the minimum the postgres image needs to start
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

  # Holds only the PUBLIC key: it can check tokens, never create them.
  mcp:
    build: ./services/mcp
    image: stylist-mcp
    environment:
      MCP_HOST: 0.0.0.0
      MCP_ALLOWED_HOSTS: mcp
      MCP_JWT_PUBLIC_KEY: ${MCP_JWT_PUBLIC_KEY:?run scripts/generate_jwt_keys.py --out .env.production}
      # the product search: a model (SEARCH_MODEL) searches the web through OpenRouter, restricted to the approved stores.
      # SEARCH_PROVIDER=tavily switches back to Tavily.
      SEARCH_PROVIDER: ${SEARCH_PROVIDER:-openrouter}
      SEARCH_MODEL: ${SEARCH_MODEL:-openai/gpt-6-luna}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      # 0 = no limit: the tool server serves for as long as the search provider does. Set a number to cap it.
      MCP_DAILY_CREDITS_PER_USER: ${MCP_DAILY_CREDITS_PER_USER:-0}
      MCP_DAILY_CREDITS_GLOBAL: ${MCP_DAILY_CREDITS_GLOBAL:-0}
      MCP_RATE_LIMIT_PER_MIN: ${MCP_RATE_LIMIT_PER_MIN:-0}
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
    pids_limit: 200
    restart: unless-stopped

  # Holds the PRIVATE keys. Reachable only by caddy.
  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    image: stylist-api
    depends_on:
      postgres: { condition: service_healthy }
      mcp: { condition: service_healthy }
    environment:
      DATABASE_URL: postgresql://stylist:${POSTGRES_PASSWORD}@postgres:5432/stylist
      MCP_URL: http://mcp:8001/mcp
      MCP_JWT_PRIVATE_KEY: ${MCP_JWT_PRIVATE_KEY}
      AUTH_JWT_PRIVATE_KEY: ${AUTH_JWT_PRIVATE_KEY}
      AUTH_JWT_PUBLIC_KEY: ${AUTH_JWT_PUBLIC_KEY}
      STYLIST_MODEL: ${STYLIST_MODEL:-openrouter/openai/gpt-6-luna}
      LLM_REASONING_EFFORT: ${LLM_REASONING_EFFORT:-low}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      WEB_ORIGIN: ${PUBLIC_URL:-http://localhost:8080}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      # the image defaults to prod + secure cookies. A plain-http LOCAL test of the demo mode overrides these.
      ENVIRONMENT: ${ENVIRONMENT:-prod}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      BACKEND_MODE: ${BACKEND_MODE:-live}
      DEMO_PLAN_DELAY_S: ${DEMO_PLAN_DELAY_S:-0}   # demo mode only: how long the scripted planner takes (to test long turns)
      # caddy (the only thing that can reach this container) tells the API each visitor's real address
      FORWARDED_ALLOW_IPS: "*"
      # usage limits: 0 = none (the default). Set a number in .env.production to bring one back.
      CHAT_MESSAGES_PER_MIN: ${CHAT_MESSAGES_PER_MIN:-0}
      DAILY_CONVERSATIONS_PER_USER: ${DAILY_CONVERSATIONS_PER_USER:-0}
      BUY_LINKS_PER_MIN: ${BUY_LINKS_PER_MIN:-0}
      IP_AUTH_CALLS_PER_MIN: ${IP_AUTH_CALLS_PER_MIN:-0}
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 1g
    pids_limit: 300
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    image: stylist-web
    read_only: true
    tmpfs:
      - /tmp
      - /app/apps/web/.next/cache:uid=1000,gid=1000
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
    restart: unless-stopped

  caddy:
    image: caddy:2
    depends_on: [api, web]
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data           # keeps the https certificate between restarts
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

volumes:
  pgdata:
  caddy_data:
