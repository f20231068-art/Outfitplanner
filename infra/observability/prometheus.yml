# Prometheus: collects the numbers (metrics) from the API and the tool server every 10 seconds.
# Both endpoints need the bearer token from the mounted secret file (see scripts/init_observability.py).

global:
  scrape_interval: 10s
  evaluation_interval: 30s

scrape_configs:
  # the containers started by `docker compose up`
  - job_name: api
    metrics_path: /metrics
    authorization: { type: Bearer, credentials_file: /run/secrets/metrics_token }
    static_configs: [{ targets: ["api:8000"] }]

  - job_name: mcp
    metrics_path: /metrics
    authorization: { type: Bearer, credentials_file: /run/secrets/metrics_token }
    static_configs: [{ targets: ["mcp:8001"] }]

  # the same API when you run it directly on your machine with uvicorn (development)
  - job_name: api-on-host
    metrics_path: /metrics
    authorization: { type: Bearer, credentials_file: /run/secrets/metrics_token }
    static_configs: [{ targets: ["host.docker.internal:8000"] }]
